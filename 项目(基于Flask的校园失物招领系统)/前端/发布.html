<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发布信息 - 校园失物招领系统</title>
  <link rel="stylesheet" href="/样式/全局样式.css" />
  <link rel="stylesheet" href="/样式/页面布局.css" />
  <link rel="stylesheet" href="/样式\详情与发布.css" />
</head>
<body>
  <div id="topbar-slot"></div>
  <main class="page">
    <form id="post-form" class="form-panel" autocomplete="off">
      <h2 class="panel-title">发布失物 / 招领信息</h2>
      <p class="panel-sub">如实填写将帮助物品更快匹配；提交后需经老师审核通过后展示。</p>

      <div class="type-switch">
        <div class="type-opt type-lost active" data-v="0">
          <div class="name">🔍 丢失物品</div>
          <div class="desc">我丢失了某物，请大家留意</div>
        </div>
        <div class="type-opt type-found" data-v="1">
          <div class="name">🎁 捡到物品</div>
          <div class="desc">我捡到了某物，寻找失主</div>
        </div>
      </div>

      <div class="field">
        <label class="field-label">物品分类</label>
        <select class="field-input" id="field-category"></select>
      </div>

      <div class="field">
        <label class="field-label">标题 *</label>
        <input class="field-input" id="field-title" placeholder="如：遗失黑色皮质背包 / 捡到校园卡一张" maxlength="60" required />
      </div>

      <div class="field">
        <label class="field-label">详细描述</label>
        <textarea class="field-input" id="field-desc" rows="5" placeholder="颜色、品牌、内容物、特殊记号等特征..." maxlength="600"></textarea>
      </div>

      <div class="field">
        <label class="field-label">发生地点</label>
        <input class="field-input" id="field-loc" placeholder="如：图书馆二楼 / 一食堂门口" maxlength="120" />
      </div>

      <div class="field">
        <label class="field-label">图片上传（可选）</label>
        <div class="uploader" id="uploader">
          <div class="up-icon">📷</div>
          <div>点击上传图片</div>
          <div class="up-hint">支持 PNG / JPG / GIF ，单张最大 10MB</div>
          <input type="file" id="file-input" accept="image/*" />
        </div>
      </div>

      <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <button type="submit" class="btn btn-primary">提交发布</button>
        <button type="button" class="btn btn-ghost" onclick="history.back()">取消</button>
      </div>
    </form>
  </main>
  <div class="toast" id="toast"></div>
  <script src="/脚本/接口封装.js"></script>
  <script src="/脚本/公共工具.js"></script>
  <script src="/脚本/发布.js"></script>
</body>
</html>
